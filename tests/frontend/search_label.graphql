# Copied from website_frontend2 src/data/search.data.ts: LABEL_QUERY with
# FRAGMENT inlined.

query LabelQuery($labelID: Int!) {
  label(id: $labelID) {
    posts {
      ...Posts
    }
  }
}

fragment Posts on PostConnection {
  edges {
    node {
      id
      title
      description
      color
      author {
        id
        name
        image
      }
      date
      indexImage
      labels {
        id
        name
        color
      }
    }
  }
  pageInfo {
    endCursor
    hasPreviousPage
  }
}

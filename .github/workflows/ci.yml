name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Job names are referenced by the branch protection rules on master (Build,
# Format, Clippy, Test). Renaming a job blocks merging until the rule is updated.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # --all-targets lints the test code as well.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start MySQL and Redis
        # Started before the toolchain so the containers initialise meanwhile.
        # test-utils connects with defaults that match compose.yaml.
        run: docker compose up --detach --wait database redis
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        # insta detects CI and fails on any snapshot mismatch instead of
        # writing a new snapshot.
        run: cargo nextest run --locked --workspace --all-targets
      - name: doctests
        # nextest does not run doctests.
        run: cargo test --locked --workspace --doc
      - name: Service logs
        if: failure()
        run: docker compose logs database redis

  cargo-deny:
    name: cargo-deny check ${{ matrix.checks }}
    runs-on: ubuntu-latest
    strategy:
      # Advisories can fail for reasons outside this repository; don't let that
      # cancel the bans/licenses/sources check.
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

[package]
name = "test-utils"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Integration test harness for website_backend2"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.44", default-features = false }
envconfig = "0.11.1"
# Tests only talk plain HTTP to 127.0.0.1, so no TLS backend is needed.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sea-orm = { version = "1.1.20", features = ["sqlx-mysql", "runtime-actix-rustls", "macros", "with-chrono", "with-json"], default-features = false }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.50.0", features = ["rt", "net", "macros"] }
uuid = { version = "1.18.1", features = ["v4"] }
website_backend2 = { path = ".." }
